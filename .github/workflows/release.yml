name: Release bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-bundle:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Add MediaPipe models
        run: |
          mkdir -p backend/app/models
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task" \
            -o backend/app/models/face_landmarker.task
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task" \
            -o backend/app/models/pose_landmarker_lite.task

      - name: Package macOS release
        run: |
          mkdir -p release/ErgoVision
          rsync -a ./ release/ErgoVision/ \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'frontend/node_modules' \
            --exclude 'release'
          chmod +x release/ErgoVision/install-mac.command
          ditto -c -k --keepParent release/ErgoVision ErgoVision-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ErgoVision-macOS.zip

  windows-bundle:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Add MediaPipe models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/app/models | Out-Null
          Invoke-WebRequest `
            -Uri "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task" `
            -OutFile "backend/app/models/face_landmarker.task"
          Invoke-WebRequest `
            -Uri "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task" `
            -OutFile "backend/app/models/pose_landmarker_lite.task"

      - name: Package Windows release
        shell: pwsh
        run: |
          $Dest = "release\ErgoVision"
          New-Item -ItemType Directory -Force -Path $Dest | Out-Null

          foreach ($Item in @("backend", "frontend", "scripts", "docs")) {
            Copy-Item $Item -Destination $Dest -Recurse -Force
          }

          foreach ($File in @(
            "README.md",
            "LICENSE",
            "CHANGELOG.md",
            ".env.example",
            "install-windows.ps1"
          )) {
            if (Test-Path $File) {
              Copy-Item $File -Destination $Dest -Force
            }
          }

          Remove-Item "$Dest\frontend\node_modules" -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$Dest\*" -DestinationPath "ErgoVision-Windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ErgoVision-Windows.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [macos-bundle, windows-bundle]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-release/ErgoVision-macOS.zip
            artifacts/windows-release/ErgoVision-Windows.zip
